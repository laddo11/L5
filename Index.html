<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Love You Swarna Animation</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, -apple-system, sans-serif;
        }

        #ui {
            position: relative;
            width: 0;
            height: 0;
        }

        #ui .love {
            position: absolute;
            top: 50%;
            left: 50%;
            margin: -225px 0 0 -225px;
        }

        #ui .love_word {
            color: #ea80b0;
            font-size: 1.2rem;
            letter-spacing: 2px;
            white-space: nowrap;
            text-shadow: 0 0 10px #ea80b0, 0 0 20px #ff2a85;
            transform: translateY(-100%) rotate(-30deg);
        }

        #ui .love_horizontal {
            animation: horizontal 10s infinite alternate ease-in-out;
            animation-delay: calc(var(--i) * -300ms);
        }

        #ui .love_vertical {
            animation: vertical 20s infinite linear;
            animation-delay: calc(var(--i) * -300ms);
        }

        @keyframes horizontal {
            from {
                transform: translateX(0);
            }
            to {
                transform: translateX(450px);
            }
        }

        @keyframes vertical {
            0% { transform: translateY(180px); }
            10% { transform: translateY(45px); }
            20% { transform: translateY(10px); }
            25% { transform: translateY(45px); }
            30% { transform: translateY(90px); }
            40% { transform: translateY(180px); }
            50% { transform: translateY(315px); }
            60% { transform: translateY(405px); }
            70% { transform: translateY(440px); }
            75% { transform: translateY(405px); }
            80% { transform: translateY(360px); }
            90% { transform: translateY(247.5px); }
            100% { transform: translateY(180px); }
        }
    </style>
</head>
<body>

    <div id="ui"></div>

    <script>
        const ui = document.getElementById("ui");
        const totalItems = 100;

        for (let i = 1; i <= totalItems; i++) {
            const love = document.createElement("div");
            love.className = "love";
            love.style.setProperty("--i", i);

            love.innerHTML = `
                <div class="love_vertical">
                    <div class="love_horizontal">
                        <div class="love_word">I love you Swarna</div>
                    </div>
                </div>
            `;

            ui.appendChild(love);
        }
    </script>
</body>
</html>
